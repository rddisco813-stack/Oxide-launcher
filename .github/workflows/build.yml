name: Build Oxide Launcher
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Clone upstream (Zalith, Pojav-based)
        run: git clone --recursive https://github.com/ZalithLauncher/ZalithLauncher.git upstream
      - name: Apply Oxide overlay
        run: bash apply.sh
      - name: Build debug APK
        working-directory: upstream
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: Oxide-debug-apk, path: "upstream/**/build/outputs/apk/**/*.apk" }
